name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    name: 密钥扫描（全仓）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/check-secrets.mjs

  backend:
    name: 后端编译+单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -q test package
        working-directory: backend

  frontend:
    name: 前端单测+类型检查+构建+dist扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build   # vue-tsc + vite build + check-secrets(dist)
        working-directory: frontend
