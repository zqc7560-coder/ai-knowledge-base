name: kb

services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    command: --ngram-token-size=2 --ft_min_word_len=2 --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-kb_system}
      MYSQL_USER: ${MYSQL_USER:-kb_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["127.0.0.1:3307:3306"]
    volumes: [kb-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports: ["127.0.0.1:6380:6379"]
    volumes: [kb-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kb-pgvector
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-kb_vectors}
      POSTGRES_USER: ${PGVECTOR_USER:-kb_app}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - kb-pg-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-kb_app} -d ${PGVECTOR_DB:-kb_vectors}"]
      interval: 10s
      retries: 12

  backend:
    profiles: ["app"]
    build:
      context: ../backend
    container_name: kb-backend
    environment:
      # 密钥红线 L8：compose 只引用变量名；值来自 deploy/.env（本地）或 CI masked env（生产）
      AI_API_KEY: ${AI_API_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      REDIS_HOST: redis
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: 5432
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - kb-uploads:/app/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgvector: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]

  frontend:
    profiles: ["app"]
    build:
      context: ../frontend
    container_name: kb-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports: ["127.0.0.1:8085:80"]

volumes:
  kb-mysql-data:
  kb-redis-data:
  kb-pg-data:
  kb-uploads:
