name: kb

services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    command: --ngram-token-size=2 --ft_min_word_len=2 --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB:-kb_system}
      MYSQL_USER: ${MYSQL_USER:-kb_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["127.0.0.1:3307:3306"]
    volumes: [kb-mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: kb-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    ports: ["127.0.0.1:6380:6379"]
    volumes: [kb-redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 6

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: kb-pgvector
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-kb_vectors}
      POSTGRES_USER: ${PGVECTOR_USER:-kb_app}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - kb-pg-data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER:-kb_app} -d ${PGVECTOR_DB:-kb_vectors}"]
      interval: 10s
      retries: 12

  backend:
    profiles: ["app"]
    build:
      # context=仓库根：Dockerfile 需同时取 backend/ 源码与 deploy/maven-settings.xml
      context: ..
      dockerfile: backend/Dockerfile
      additional_contexts:
        # 宿主本地 Maven 仓库作为离线依赖种子（容器网络够不着国内镜像源的现实约束；
        # CI/正常网络机器可把下面两行删掉改在线拉取）
        m2seed: "E:/develop/apache-maven-3.9.4/mvn_repo"
    container_name: kb-backend
    environment:
      # 密钥红线 L8：compose 只引用变量名；值来自 deploy/.env（本地）或 CI masked env（生产）
      AI_API_KEY: ${AI_API_KEY}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-kb_system}
      MYSQL_USER: ${MYSQL_USER:-kb_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: 5432
      PGVECTOR_DB: ${PGVECTOR_DB:-kb_vectors}
      PGVECTOR_USER: ${PGVECTOR_USER:-kb_app}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD}
      KB_ADMIN_USERNAME: ${KB_ADMIN_USERNAME:-}
      KB_ADMIN_PASSWORD: ${KB_ADMIN_PASSWORD:-}
      # 找回密码 SMTP（M11.3）：值在 deploy/.env；未配置时 reset-available 返回 false，前端自动隐藏入口
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SSL: ${MAIL_SSL:-1}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      UPLOAD_DIR: /app/data/uploads
      # 本机 WSL2 容器直连外网被掐（docs/08 已知坑）：deploy/.env 配
      # KB_PROXY_OPTS="-Dhttps.proxyHost=host.docker.internal -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=..."
      # 即可让 AI 上游调用走宿主代理；正常联网机器留空零感知。
      JAVA_OPTS: ${KB_PROXY_OPTS:-}
      MILVUS_URL: http://kb-milvus:19530
    volumes:
      - kb-uploads:/app/data/uploads
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgvector: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8080"]

  frontend:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: kb-frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    ports: ["127.0.0.1:8085:80"]

  milvus:
    profiles: ["vector-milvus"]
    image: milvusdb/milvus:v2.3.16
    container_name: kb-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      # 本机拉不到 minio 镜像（各镜像源拒），用 local 存储引擎把段文件写进 volume；
      # standalone 仍硬依赖 etcd（v2.3 不内嵌），compose 网络内按服务名引用
      ETCD_ENDPOINTS: kb-etcd:2379
      COMMON_STORAGETYPE: local
    volumes: [kb-milvus-data:/var/lib/milvus]
    depends_on:
      - etcd
    ports: ["127.0.0.1:19530:19530"]

  etcd:
    profiles: ["vector-milvus"]
    image: quay.io/coreos/etcd:v3.5.13
    container_name: kb-etcd
    command: ["etcd", "--advertise-client-urls", "http://kb-etcd:2379", "--listen-client-urls", "http://0.0.0.0:2379"]

volumes:
  kb-mysql-data:
  kb-redis-data:
  kb-pg-data:
  kb-uploads:
  kb-milvus-data:
