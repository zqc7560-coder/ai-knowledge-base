# HTTPS 监听（与 default.conf 并存：default 管 80，本文件管 8443）。
# 证书由 gen-selfsigned-cert.sh 生成到 deploy/certs/，经 compose 的 tls profile 挂载进来。
# 生产替换 kb.crt/kb.key 为 CA 证书即可，其余不改。
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/kb.crt;
    ssl_certificate_key /etc/nginx/certs/kb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
