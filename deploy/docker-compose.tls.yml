# TLS 覆盖：docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile app --profile tls up -d
# 给 frontend(nginx) 追加 8443 端口 + 挂载 TLS 配置与证书目录（证书先跑 gen-selfsigned-cert.sh 生成）。
# 与主文件分离的原因：主 compose 不带证书依赖也能起（HTTP only），证书文件缺失时不阻断常规部署。
services:
  frontend:
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx-tls.conf:/etc/nginx/conf.d/tls.conf:ro
      - ./certs:/etc/nginx/certs:ro
